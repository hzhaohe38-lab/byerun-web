apply plugin: 'com.android.application'

android {
    namespace = "com.qinghaipao.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.qinghaipao.app"
        minSdkVersion rootProject.ext.minSdkVersion
        // 28 on purpose: Android 10+ refuses exec() from the app's data dir for
        // targetSdk >= 29, and this app spawns a bundled node binary from there.
        // Termux pins the same value for the same reason.
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // assets/ holds the ~110 MB node runtime; it is already deflate-hostile
    // (ELF + JS), so let aapt compress it once and stream it out at runtime.
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
}
